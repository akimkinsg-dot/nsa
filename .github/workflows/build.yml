name: Build VST3
on: [push, workflow_dispatch]
jobs:
  mac:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - run: cmake -B build -G Xcode "-DCMAKE_OSX_ARCHITECTURES=arm64;x86_64"
      - run: cmake --build build --config Release
      - run: |
          cd build/NSAChords_artefacts/Release/VST3
          codesign --force --deep -s - "NSA Chords.vst3"
          zip -r "$GITHUB_WORKSPACE/NSA-Chords-mac.zip" "NSA Chords.vst3"
      - uses: actions/upload-artifact@v4
        with: { name: NSA-Chords-mac, path: NSA-Chords-mac.zip }
  win:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - run: cmake -B build
      - run: cmake --build build --config Release
      - run: Compress-Archive -Path "build/NSAChords_artefacts/Release/VST3/NSA Chords.vst3" -DestinationPath NSA-Chords-win.zip
      - uses: actions/upload-artifact@v4
        with: { name: NSA-Chords-win, path: NSA-Chords-win.zip }
